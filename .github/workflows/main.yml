name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. 安装旧版 NDK
      - name: Setup Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # 2. 暴力修改所有 gradle 文件里的 ndk 版本为 26
      - name: Force NDK Version in Gradle files
        run: |
          find . -name "*.gradle*" -exec sed -i 's/ndkVersion.*=.*"[0-9.]*"/ndkVersion = "26.1.10909125"/g' {} +

      # 3. 开始编译，强行注入 CMake 参数
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.project.android.ndkVersion=26.1.10909125 -DCMAKE_ANDROID_NDK=$ANDROID_NDK_HOME

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinuxHub-debug
          path: app/build/outputs/apk/debug/*.apk
